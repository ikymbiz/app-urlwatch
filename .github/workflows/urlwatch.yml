name: urlwatch

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout urlwatch repository
        uses: actions/checkout@v4
        with:
          repository: thp/urlwatch
          path: urlwatch
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyyaml
          python -m pip install ../urlwatch

      - name: Build urlwatch config
        working-directory: app
        run: |
          python scripts/build-urlwatch-config.py

      - name: Restore urlwatch history
        uses: actions/cache@v4
        with:
          path: app/.urlwatch-cache
          key: urlwatch-cache-${{ github.run_id }}
          restore-keys: |
            urlwatch-cache-

      - name: Prepare cache directory
        working-directory: app
        run: |
          mkdir -p .urlwatch-cache

      - name: Run urlwatch
        working-directory: app
        env:
          RSS_SITE_URL: ${{ vars.RSS_SITE_URL }}
          RSS_MAX_ITEMS: "100"
        run: |
          urlwatch --verbose \
            --urls generated/urls.yaml \
            --config generated/urlwatch.yaml \
            --cache .urlwatch-cache/cache.db

      - name: Commit RSS feed
        working-directory: app
        run: |
          if [[ -n "$(git status --porcelain docs/feed.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/feed.xml
            git commit -m "Update urlwatch RSS feed"
            git push
          else
            echo "No RSS feed changes."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
